name: 发布镜像

# 打 vX.Y.Z 标签时，把镜像发到 GHCR（amd64 + arm64）。
# 手动运行（workflow_dispatch）默认只构建和冒烟测试，不推送；勾选 push 才推送。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      push:
        description: '推送到 ghcr.io（默认只构建测试）'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kcgoofee-jpg/ccst

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 版本和标签一致
        run: |
          node scripts/version.mjs --check
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            v=$(node -p "require('./package.json').version")
            [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "标签 ${GITHUB_REF_NAME} 和 package.json 版本 v$v 不一致"; exit 1; }
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # arm64 在 QEMU 下先起一遍：Claude CLI 在可选依赖里，要确认 arm64 上装得上、代理能起来
      - name: arm64 冒烟测试
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: ccst:arm64-smoke
      - name: arm64 起容器并检查
        run: |
          docker run -d --name ccst-arm --platform linux/arm64 -p 127.0.0.1:8901:8901 -e CLAUDE_SUBSCRIPTION_LAN_KEY=ci-test-key ccst:arm64-smoke
          for i in $(seq 1 60); do
            if curl -fsS -H 'Authorization: Bearer ci-test-key' http://127.0.0.1:8901/status | grep -q '"plugin":"claude-subscription"'; then ok=1; break; fi
            sleep 2
          done
          docker logs ccst-arm | tail -20
          [ "${ok:-0}" = 1 ] || { echo "arm64 容器没有起来"; exit 1; }
      - name: 标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=manual,enable=${{ github.ref_type != 'tag' }}
      - uses: docker/login-action@v3
        if: github.ref_type == 'tag' || inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建双架构${{ (github.ref_type == 'tag' || inputs.push) && '并推送' || '（不推送）' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
