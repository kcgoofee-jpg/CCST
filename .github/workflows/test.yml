name: 测试

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: 语法检查
        run: |
          for f in server.js bin/*.js scripts/*.mjs launcher/*.mjs src/*/*.js; do node --check "$f"; done
      - run: node scripts/version.mjs --check
      - name: 安装脚本静态检查
        run: |
          sh -n deploy/install.sh
          shellcheck deploy/install.sh

  # 只验证能构建，不推送到任何镜像仓库
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ccst:ci
      - name: 容器起得来、健康检查通过、非本机请求要密码
        run: |
          docker run -d --name ccst -p 127.0.0.1:18961:8901 -e CLAUDE_SUBSCRIPTION_LAN_KEY=ci-test-key ccst:ci
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' ccst)
            [ "$s" = healthy ] && break
            sleep 2
          done
          echo "health: $s"
          docker logs ccst
          [ "$s" = healthy ]
          # 从宿主机进来的请求对容器不是本机：不带密码 401，带密码 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18961/status)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-test-key' http://127.0.0.1:18961/status)" = 200
          test "$(docker exec ccst id -u)" != 0

  # deploy/compose 示例能解析，并且两个容器真的连得上（酒馆容器用名字「ccst」带访问密码访问代理）
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose 配置校验
        run: |
          echo "CCST_ACCESS_KEY=ci-compose-key" > deploy/.env
          docker compose -f deploy/docker-compose.yml config -q
      - name: 起两个容器
        run: |
          docker compose -f deploy/docker-compose.yml up -d --build
          for i in $(seq 1 45); do
            s=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose -f deploy/docker-compose.yml ps -q ccst)")
            [ "$s" = healthy ] && break
            sleep 2
          done
          echo "ccst health: $s"
          docker compose -f deploy/docker-compose.yml logs
          [ "$s" = healthy ]
      - name: 酒馆容器到代理：要密码、带密码才通；宿主机端口只在 127.0.0.1
        run: |
          C="docker compose -f deploy/docker-compose.yml exec -T sillytavern node -e"
          $C "fetch('http://ccst:8901/status').then(r=>process.exit(r.status===401?0:1),()=>process.exit(2))"
          $C "fetch('http://ccst:8901/status',{headers:{Authorization:'Bearer ci-compose-key'}}).then(r=>r.json()).then(j=>process.exit(j.plugin==='claude-subscription'?0:1),()=>process.exit(2))"
          $C "fetch('http://ccst:8901/status',{headers:{Authorization:'Bearer wrong'}}).then(r=>process.exit(r.status===401?0:1),()=>process.exit(2))"
          ss -ltn | grep -E ':(8000|8901)\s' | tee /tmp/ports
          ! grep -E '(0\.0\.0\.0|\*|\[::\]):(8000|8901)\s' /tmp/ports
      - if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  # 服务器安装脚本：在真 Linux 上无人值守跑完整流程（systemd --user 分支 + nohup 分支）
  install-linux:
    runs-on: ubuntu-latest
    env:
      CCST_REPO: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 准备 systemd --user（linger + 用户总线）
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          sleep 2
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: systemd 分支：安装（令牌从环境变量）并检查
        env:
          CLAUDE_CODE_OAUTH_TOKEN: FAKE_CI_TOKEN_0123456789
        run: |
          systemctl --user show-environment >/dev/null
          sh deploy/install.sh --dir "$RUNNER_TEMP/ccst-sd" --port 18971 --token-from-env > "$RUNNER_TEMP/install.out" 2>&1 || { cat "$RUNNER_TEMP/install.out"; exit 1; }
          cat "$RUNNER_TEMP/install.out"
          # 令牌绝不能出现在输出里；配置文件权限 0600 且含令牌
          ! grep -q "FAKE_CI_TOKEN" "$RUNNER_TEMP/install.out"
          test "$(stat -c %a ~/.config/ccst/env)" = 600
          grep -q '^CLAUDE_CODE_OAUTH_TOKEN=FAKE_CI_TOKEN' ~/.config/ccst/env
          systemctl --user is-active ccst-proxy.service
          test "$(curl -s http://127.0.0.1:18971/status | node -p 'JSON.parse(require("fs").readFileSync(0)).plugin')" = claude-subscription
          # 默认只监听本机
          ss -ltn | grep ':18971\s' | grep -q '127.0.0.1:18971'
      - name: systemd 分支：重新运行沿用访问密码；--public 要密码
        run: |
          k1=$(sed -n 's/^CLAUDE_SUBSCRIPTION_LAN_KEY=//p' ~/.config/ccst/env)
          sh deploy/install.sh --dir "$RUNNER_TEMP/ccst-sd" --port 18971 --public --skip-install > "$RUNNER_TEMP/install2.out" 2>&1 || { cat "$RUNNER_TEMP/install2.out"; exit 1; }
          cat "$RUNNER_TEMP/install2.out"
          k2=$(sed -n 's/^CLAUDE_SUBSCRIPTION_LAN_KEY=//p' ~/.config/ccst/env)
          [ "$k1" = "$k2" ]
          grep -q '0.0.0.0' "$RUNNER_TEMP/install2.out"
          ! grep -q "$k1" "$RUNNER_TEMP/install2.out"
          # 令牌在重跑后仍在（没带 --token 时不清掉）
          grep -q '^CLAUDE_CODE_OAUTH_TOKEN=' ~/.config/ccst/env
          ip=$(hostname -I | awk '{print $1}')
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://$ip:18971/status")" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $k1" "http://$ip:18971/status")" = 200
      - name: systemd 分支：卸载
        run: |
          sh deploy/install.sh --uninstall --remove-files
          ! systemctl --user is-active ccst-proxy.service
          test ! -e ~/.config/systemd/user/ccst-proxy.service
          test ! -e ~/.config/ccst/env
          test ! -d "$RUNNER_TEMP/ccst-sd"
          ! curl -s --max-time 2 http://127.0.0.1:18971/status
      - name: nohup 分支：安装、检查、卸载
        env:
          CCST_NO_SYSTEMD: '1'
        run: |
          sh deploy/install.sh --dir "$RUNNER_TEMP/ccst-nh" --port 18972
          test "$(curl -s http://127.0.0.1:18972/status | node -p 'JSON.parse(require("fs").readFileSync(0)).plugin')" = claude-subscription
          test -s ~/.config/ccst/proxy.pid
          sh deploy/install.sh --uninstall --remove-files
          test ! -e ~/.config/ccst/proxy.pid
          ! curl -s --max-time 2 http://127.0.0.1:18972/status

  # Windows 真机执行：npm test + 启动器（core.mjs 的 netstat / tasklist / 后台启动）+ claude-max.ps1
  windows:
    runs-on: windows-latest
    env:
      PROXY_PORT: '18951'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: 启动器：启动代理（备用端口）
        shell: powershell
        run: node launcher/core.mjs start; if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: 启动器：检查状态
        shell: powershell
        run: node launcher/core.mjs check; if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: claude-max.ps1 status（Windows PowerShell 5.1）
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File launcher\windows\claude-max.ps1 status
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: 启动器：按端口上的进程号关闭，并确认端口空了
        shell: powershell
        run: |
          node launcher/core.mjs stop
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Sleep -Seconds 2
          if (netstat -ano | Select-String ":$env:PROXY_PORT\s.*LISTENING") { Write-Error 'port still listening'; exit 1 }
      - name: 一键安装（Windows）：在克隆的 SillyTavern 上跑 .bat 和 .ps1，检查结果
        shell: powershell
        env:
          CCST_YES: '1'
          CCST_SKIP_LOGIN: '1'
          CCST_NO_PROCESS_SCAN: '1'
        run: |
          git clone --depth 1 https://github.com/SillyTavern/SillyTavern "$env:RUNNER_TEMP\SillyTavern"
          Copy-Item "$env:RUNNER_TEMP\SillyTavern\default\config.yaml" "$env:RUNNER_TEMP\SillyTavern\config.yaml"
          $env:CCST_ST_DIR = "$env:RUNNER_TEMP\SillyTavern"
          $env:CCST_REPO_URL = "$env:GITHUB_WORKSPACE"
          # 用 .bat 跑（同时验证 .bat 找得到 .ps1），第二遍验证可重复运行
          $bat = (Get-ChildItem installer -Filter *.bat).FullName
          & $bat
          if ($LASTEXITCODE -ne 0) { Write-Error 'installer failed'; exit 1 }
          if (-not (Test-Path "$env:RUNNER_TEMP\SillyTavern\plugins\CCST\package.json")) { Write-Error 'plugins/CCST missing'; exit 1 }
          if (-not (Test-Path "$env:RUNNER_TEMP\SillyTavern\plugins\CCST\node_modules")) { Write-Error 'npm install did not run'; exit 1 }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\SillyTavern\config.yaml" -Pattern '^enableServerPlugins: true' -Quiet)) { Write-Error 'config.yaml not updated'; exit 1 }
          if (@(Get-ChildItem "$env:RUNNER_TEMP\SillyTavern" -Filter 'config.yaml.ccst-backup-*').Count -ne 1) { Write-Error 'expected one backup'; exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\ccst-install.ps1
          if ($LASTEXITCODE -ne 0) { Write-Error 'second run failed'; exit 1 }
          if (@(Get-ChildItem "$env:RUNNER_TEMP\SillyTavern" -Filter 'config.yaml.ccst-backup-*').Count -ne 1) { Write-Error 'second run made another backup'; exit 1 }
      - name: 一键安装（Windows）：没有 git 时走下载 zip 的路径
        shell: powershell
        env:
          CCST_YES: '1'
          CCST_SKIP_LOGIN: '1'
          CCST_NO_PROCESS_SCAN: '1'
        run: |
          git clone --depth 1 https://github.com/SillyTavern/SillyTavern "$env:RUNNER_TEMP\ST2"
          Copy-Item "$env:RUNNER_TEMP\ST2\default\config.yaml" "$env:RUNNER_TEMP\ST2\config.yaml"
          $stage = "$env:RUNNER_TEMP\zipstage"
          New-Item -ItemType Directory "$stage\CCST-main" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\package.json" "$stage\CCST-main\"
          Compress-Archive -Path "$stage\CCST-main" -DestinationPath "$env:RUNNER_TEMP\ccst.zip"
          $env:CCST_ST_DIR = "$env:RUNNER_TEMP\ST2"
          $env:CCST_REPO_URL = "$env:RUNNER_TEMP\does-not-exist"
          $env:CCST_ZIP_URL = ([Uri]"$env:RUNNER_TEMP\ccst.zip").AbsoluteUri
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\ccst-install.ps1
          if ($LASTEXITCODE -ne 0) { Write-Error 'zip install failed'; exit 1 }
          if (-not (Test-Path "$env:RUNNER_TEMP\ST2\plugins\CCST\package.json")) { Write-Error 'plugins/CCST missing'; exit 1 }
      - name: 收尾：万一前面失败，按 PID 文件关掉代理
        if: always()
        shell: powershell
        run: |
          Get-ChildItem data\logs -Filter *.pid -ErrorAction SilentlyContinue | ForEach-Object {
            $p = [int](Get-Content $_.FullName); Stop-Process -Id $p -Force -ErrorAction SilentlyContinue
          }
