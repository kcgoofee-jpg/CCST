# CCST + SillyTavern 的 Docker Compose 示例：两个容器。
# （CCST 当酒馆插件只在「酒馆和代理在同一个进程目录」时可行，跨容器不行，所以酒馆走自定义端点连代理。）
#
#   1. 在这个文件旁边建 .env（不要提交），写一行访问密码：
#        CCST_ACCESS_KEY=<openssl rand -hex 24 的结果>
#   2. docker compose -f deploy/docker-compose.yml up -d --build
#   3. 订阅登录（用 API 密钥等后端的话跳过），二选一：
#        a. 在有浏览器的电脑上 claude setup-token，把令牌写进 .env：CLAUDE_CODE_OAUTH_TOKEN=<令牌>，再取消下面对应行的注释
#        b. docker compose -f deploy/docker-compose.yml exec ccst node bin/claude-cli.js auth login
#           打印的网址在你自己的浏览器打开授权，授权码粘贴回终端；登录信息存在 ccst-data 卷里。
#   4. 浏览器打开 http://localhost:8000（远程服务器用 SSH 隧道，见 docs/使用指南.md），
#      酒馆「扩展 → 安装扩展」填 https://github.com/kcgoofee-jpg/CCST 装面板；
#      面板「其他 → 手机连接」：代理地址 http://localhost:8901/v1、访问密码、酒馆侧地址 http://ccst:8901/v1，再点「一键连接」。
#      （手动连接：酒馆 API 连接选「自定义」，地址 http://ccst:8901/v1，API 密钥栏填访问密码。）
#
# 两个端口默认都只映射到宿主机的 127.0.0.1。容器外（宿主机、其他机器）访问代理都算「远程」，必须带访问密码。
# 酒馆自己的访问保护（白名单 / 账号 / 密码）见 docs/使用指南.md「安全清单」；要对外开放先配好它们和 HTTPS。
services:
  ccst:
    build:
      context: ..
    image: ccst:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8901:8901"
    environment:
      # 酒馆容器用「ccst」这个名字访问代理：代理默认只认本机名和 IP，要把它加进来
      CLAUDE_SUBSCRIPTION_ALLOWED_HOSTS: ccst
      # 浏览器页面来自你的域名（HTTPS 反向代理）时，把页面的地址加在这里，逗号分隔；只用 localhost 不用设
      # CLAUDE_SUBSCRIPTION_ALLOWED_ORIGINS: https://st.example.com
      # 订阅令牌（claude setup-token 得到，放在 .env 里；不设就用下面 auth login 存的登录信息）
      # CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      # 必填：酒馆 / TauriTavern 的 Custom 端点 API 密钥栏填同一个值
      CLAUDE_SUBSCRIPTION_LAN_KEY: ${CCST_ACCESS_KEY:?在 .env 里设置 CCST_ACCESS_KEY}

      # ── 后端：不设就是订阅（需要上面第 3 步登录）。下面选一种取消注释 ──
      # API 密钥：
      # CLAUDE_SUBSCRIPTION_BACKEND: apikey
      # CLAUDE_SUBSCRIPTION_API_KEY: ${ANTHROPIC_API_KEY}
      # OpenRouter：
      # CLAUDE_SUBSCRIPTION_BACKEND: openrouter
      # CLAUDE_SUBSCRIPTION_OPENROUTER_KEY: ${OPENROUTER_API_KEY}
      # AWS Bedrock（密钥方式；也可以用 CLAUDE_SUBSCRIPTION_BEDROCK_TOKEN）：
      # CLAUDE_SUBSCRIPTION_BACKEND: bedrock
      # CLAUDE_SUBSCRIPTION_AWS_REGION: us-east-1
      # CLAUDE_SUBSCRIPTION_AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      # CLAUDE_SUBSCRIPTION_AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # Google Vertex（服务账号 JSON 放进 ccst-data 卷，路径按容器内写）：
      # CLAUDE_SUBSCRIPTION_BACKEND: vertex
      # CLAUDE_SUBSCRIPTION_VERTEX_PROJECT: my-project
      # CLAUDE_SUBSCRIPTION_VERTEX_REGION: us-east5
      # CLAUDE_SUBSCRIPTION_VERTEX_CREDENTIALS: /data/vertex.json
    volumes:
      - ccst-data:/data


  sillytavern:
    image: ghcr.io/sillytavern/sillytavern:latest
    restart: unless-stopped
    depends_on:
      - ccst
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - st-config:/home/node/app/config
      - st-data:/home/node/app/data
      - st-extensions:/home/node/app/public/scripts/extensions/third-party

volumes:
  ccst-data:
  st-config:
  st-data:
  st-extensions:
