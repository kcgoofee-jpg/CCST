[workspace]
resolver = "2"
members = ["crates/ccst-auth", "crates/ccst-wire", "crates/ccst-chat", "crates/ccst"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "socks", "stream"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
dirs = "6"
